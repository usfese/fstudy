name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build without publishing, for example 1.0.0. Defaults to pubspec.yaml.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  android:
    name: Build and publish Android APKs
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    env:
      API_BASE_URL: https://fstudy-api.usfese.cc

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
            case "$TAG" in
              v*) VERSION="${TAG#v}" ;;
              *) echo "::error::Release tag must start with v"; exit 1 ;;
            esac
          else
            TAG=""
            VERSION="${INPUT_VERSION:-}"
          fi

          if [ -z "$VERSION" ]; then
            VERSION="$(sed -n 's/^version:[[:space:]]*//p' apps/mobile/pubspec.yaml | head -n1)"
            VERSION="${VERSION%%+*}"
          fi
          VERSION="${VERSION#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid SemVer version: $VERSION"
            exit 1
          fi

          PUBSPEC_VERSION="$(sed -n 's/^version:[[:space:]]*//p' apps/mobile/pubspec.yaml | head -n1)"
          PUBSPEC_BASE="${PUBSPEC_VERSION%%+*}"
          BUILD_NUMBER="${PUBSPEC_VERSION##*+}"

          if [ "$PUBSPEC_BASE" != "$VERSION" ]; then
            echo "::error::Version mismatch: release=$VERSION pubspec=$PUBSPEC_BASE"
            exit 1
          fi

          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::pubspec.yaml must contain version: MAJOR.MINOR.PATCH+BUILD"
            exit 1
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            git fetch origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $TAG is not reachable from main"
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building FStudy $VERSION ($BUILD_NUMBER) from $GITHUB_SHA"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          test -s "$RUNNER_TEMP/upload-keystore.jks"
          chmod 600 "$RUNNER_TEMP/upload-keystore.jks"

          escape_property() {
            local value="$1"
            value="${value//\\/\\\\}"
            printf '%s' "$value"
          }

          {
            printf 'storePassword=%s\n' "$(escape_property "$ANDROID_KEYSTORE_PASSWORD")"
            printf 'keyPassword=%s\n' "$(escape_property "$ANDROID_KEY_PASSWORD")"
            printf 'keyAlias=%s\n' "$(escape_property "$ANDROID_KEY_ALIAS")"
            printf 'storeFile=%s\n' "$RUNNER_TEMP/upload-keystore.jks"
          } > apps/mobile/android/key.properties
          chmod 600 apps/mobile/android/key.properties

      - name: Build universal APK
        working-directory: apps/mobile
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$GITHUB_WORKSPACE/release/fstudy-v${VERSION}-universal.apk"

      - name: Build split APKs
        working-directory: apps/mobile
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

          for abi in armeabi-v7a arm64-v8a x86_64; do
            source="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            test -f "$source"
            cp "$source" "$GITHUB_WORKSPACE/release/fstudy-v${VERSION}-${abi}.apk"
          done

      - name: Verify release signatures
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          APKSIGNER="$(find "$SDK" -type f -name apksigner | sort -V | tail -n1)"
          test -n "$APKSIGNER"

          shopt -s nullglob
          apks=("$GITHUB_WORKSPACE"/release/*.apk)
          if [ "${#apks[@]}" -ne 4 ]; then
            echo "::error::Expected 4 APKs, found ${#apks[@]}"
            exit 1
          fi

          for apk in "${apks[@]}"; do
            echo "Verifying $(basename "$apk")"
            output="$("$APKSIGNER" verify --print-certs "$apk")"
            if echo "$output" | grep -qi 'CN=Android Debug'; then
              echo "::error::Debug-signed APK detected: $apk"
              exit 1
            fi
          done

      - name: Create release metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "version=$VERSION"
            echo "build_number=$BUILD_NUMBER"
            echo "commit=$GITHUB_SHA"
            echo "tag=${TAG:-manual}"
          } > "$GITHUB_WORKSPACE/release/BUILD_INFO.txt"

          cd "$GITHUB_WORKSPACE/release"
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
            | sort \
            | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fstudy-android-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          PRERELEASE=()
          case "$TAG" in
            *-*) PRERELEASE=(--prerelease) ;;
          esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$GITHUB_WORKSPACE"/release/* --clobber
          else
            gh release create "$TAG" "$GITHUB_WORKSPACE"/release/* \
              --title "FStudy $TAG" \
              --generate-notes \
              --verify-tag \
              "${PRERELEASE[@]}"
          fi

      - name: Remove signing material
        if: always()
        run: |
          rm -f apps/mobile/android/key.properties "$RUNNER_TEMP/upload-keystore.jks"
